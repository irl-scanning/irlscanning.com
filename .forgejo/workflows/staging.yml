name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install AWS CLI
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes curl unzip
          curl --fail --location --silent --show-error \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.36.39.zip \
            --output /tmp/awscliv2.zip
          printf '%s  %s\n' \
            2b337174417c159f8fd825637841f5425308108bd6f99681664409fb0d7ebe01 \
            /tmp/awscliv2.zip | sha256sum --check
          unzip -q /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install

      - name: Deploy static assets to Garage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: garage
          AWS_ENDPOINT_URL: http://garage:3900
        run: |
          set -euo pipefail
          aws s3 mb s3://staging 2>/dev/null || true
          aws s3api put-bucket-website --bucket staging --website-configuration \
            '{"IndexDocument":{"Suffix":"index.html"}}'
          aws s3 sync public/ s3://staging/ --delete

      - name: Verify staging
        run: |
          curl --fail --silent --show-error --max-time 15 \
            --header 'Host: staging.site.intranet.irlscanning.com' \
            http://garage:3902/ >/dev/null
