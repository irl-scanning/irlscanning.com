name: Deploy preview

on:
  issue_comment:
    types: [created]

concurrency:
  group: preview-site
  cancel-in-progress: false

jobs:
  deploy:
    if: forgejo.event.comment.body == '!deploy' && forgejo.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Authorize request and resolve pull request
        id: preview
        env:
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          PR_NUMBER: ${{ forgejo.event.issue.number }}
          REQUESTOR: ${{ forgejo.actor }}
        run: |
          set -euo pipefail
          permission=$(curl --fail --silent --show-error \
            --header "Authorization: token $FORGEJO_TOKEN" \
            "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/collaborators/$REQUESTOR/permission" |
            jq -r .permission)
          case "$permission" in admin|write) ;; *) exit 1 ;; esac

          pr=$(curl --fail --silent --show-error \
            --header "Authorization: token $FORGEJO_TOKEN" \
            "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/pulls/$PR_NUMBER")
          test "$(jq -r .state <<<"$pr")" = open
          test "$(jq -r .head.repo.id <<<"$pr")" = "$(jq -r .base.repo.id <<<"$pr")"

          branch=$(jq -r .head.ref <<<"$pr")
          sha=$(jq -r .head.sha <<<"$pr")
          lower=$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]')
           label=$(printf '%s' "$lower" | tr -cs 'a-z0-9-' '-' | sed 's/^-*//; s/-*$//' | cut -c1-48)
           test -n "$label"
           if [ "$branch" != "$label" ] || [ "$label" = staging ] || [ "$label" = main ] || [ "${#label}" -lt 3 ]; then
             hash=$(printf '%s' "$branch" | sha256sum | cut -c1-8)
             label="${label:0:39}-$hash"
          fi
          printf 'sha=%s\nlabel=%s\n' "$sha" "$label" >> "$FORGEJO_OUTPUT"

      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ steps.preview.outputs.sha }}
          persist-credentials: false

      - name: Install AWS CLI
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes curl unzip
          curl --fail --location --silent --show-error \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.36.39.zip \
            --output /tmp/awscliv2.zip
          printf '%s  %s\n' \
            2b337174417c159f8fd825637841f5425308108bd6f99681664409fb0d7ebe01 \
            /tmp/awscliv2.zip | sha256sum --check
          unzip -q /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install

      - name: Deploy static assets to Garage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: garage
          AWS_ENDPOINT_URL: http://s3.intranet.irlscanning.com
          BUCKET: ${{ steps.preview.outputs.label }}
        run: |
          set -euo pipefail
          printf '100.64.0.7 s3.intranet.irlscanning.com site.intranet.irlscanning.com\n' >> /etc/hosts
          aws s3 mb "s3://$BUCKET" 2>/dev/null || true
          aws s3api put-bucket-website --bucket "$BUCKET" --website-configuration \
            '{"IndexDocument":{"Suffix":"index.html"}}'
           aws s3api put-bucket-lifecycle-configuration --bucket "$BUCKET" \
             --lifecycle-configuration \
             '{"Rules":[{"ID":"expire-preview","Status":"Enabled","Filter":{"Prefix":""},"Expiration":{"Days":14}}]}'
           aws s3 rm "s3://$BUCKET/" --recursive || true
           aws s3 cp public/ "s3://$BUCKET/" --recursive

      - name: Report preview URL
        env:
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          LABEL: ${{ steps.preview.outputs.label }}
          PR_NUMBER: ${{ forgejo.event.issue.number }}
        run: |
           jq -n --arg body "Preview deployed for 14 days: https://site.intranet.irlscanning.com/$LABEL/" \
            '{body:$body}' |
            curl --fail --silent --show-error --request POST \
              --header "Authorization: token $FORGEJO_TOKEN" \
              --header 'Content-Type: application/json' --data-binary @- \
              "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/issues/$PR_NUMBER/comments" >/dev/null
