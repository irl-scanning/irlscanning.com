<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620">
  <style>
    .grid-line {
      fill: none;
      stroke: rgba(255, 189, 138, 0.16);
      stroke-width: 1;
    }

    .venue-shape path:not([fill]) {
      fill: none;
      stroke: rgba(255, 255, 255, 0.68);
      stroke-width: 1.5;
    }

    .scanner path {
      stroke: #ffbd8a;
      stroke-width: 2;
    }

    .scan-rings ellipse {
      fill: none;
      stroke: #ff6f00;
      stroke-width: 1.5;
      stroke-dasharray: 5 9;
    }

    .scan-rings ellipse:nth-child(2) {
      opacity: 0.6;
    }

    .scan-rings ellipse:nth-child(3) {
      opacity: 0.35;
    }

    .points circle {
      fill: #ffce00;
    }
  </style>
  <defs>
    <linearGradient id="scan-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6f00"/>
      <stop offset="1" stop-color="#a34700"/>
    </linearGradient>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <ellipse cx="325" cy="340" rx="270" ry="170" fill="#ff6f00" filter="url(#soft-glow)" opacity=".18"/>
